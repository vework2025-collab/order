<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Requirement Entry</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 40px;
}

.card {
  background: #fff;
  padding: 40px;
  border-radius: 16px;
  max-width: 900px;
  margin: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
  color: #0b5bd3;
  margin-bottom: 30px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px 30px;
}

label {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 6px;
  display: block;
}

input, select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #d9d9d9;
  font-size: 14px;
}

.file-box {
  border: 2px dashed #d0d7e2;
  padding: 12px;
  border-radius: 10px;
  background: #fafcff;
}

.full {
  grid-column: span 2;
}

button {
  margin-top: 30px;
  padding: 12px 40px;
  background: #0b5bd3;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #094db3;
}

#msg {
  margin-top: 15px;
  text-align: center;
  font-weight: 600;
}

@media (max-width: 768px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
  .full {
    grid-column: span 1;
  }
}
</style>

</head>

<body>
<div class="card">
  <h2>Requirement Entry</h2>

  <div class="form-grid">

    <div>
      <label>Item Code</label>
      <select id="itemCode"></select>
    </div>

    <div>
      <label>Item Name</label>
      <input list="itemNames" id="itemName">
      <datalist id="itemNames"></datalist>
    </div>

    <div>
      <label>Color</label>
      <select id="color"></select>
    </div>

    <div>
      <label>Qty</label>
      <input type="number" id="qty">
    </div>

    <div class="full">
      <label>Item Photo</label>
      <div class="file-box">
        <input type="file" id="photo">
      </div>
    </div>

    <div>
      <label>Qty Type</label>
      <select id="qtyType"></select>
    </div>

    <div>
      <label>Unit Name</label>
      <select id="unit"></select>
    </div>

    <div>
      <label>Person Name</label>
      <input type="text" id="person">
    </div>

    <div>
      <label>Requirement Type</label>
      <select id="reqType">
        <option>Normal</option>
        <option>Urgent</option>
      </select>
    </div>

  </div>

  <div style="text-align:center;">
    <button onclick="saveData()">Save</button>
    <p id="msg"></p>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7hMsJo0lffwCEUKkb0JKaXPk1-YYkBAbD9i3jvBwM7gEdT1sRB3L7oIr0X4rxQMFWNA/exec";

/* ---------- JSONP loader ---------- */
function loadDropdowns(){
  const cb = "cb_"+Date.now();
  window[cb] = data => {
    fill("itemCode", data.itemNames);
    fill("itemNames", data.itemNames, true);
    fill("color", data.colors);
    fill("qtyType", data.qtyTypes);
    fill("unit", data.units);
  };
  const s = document.createElement("script");
  s.src = SCRIPT_URL + "?action=getDropdowns&callback=" + cb;
  document.body.appendChild(s);
  window[cb] = data => {
  fill("itemCode", data.itemNames);
  fill("itemNames", data.itemNames, true);
  fill("color", data.colors);
  fill("qtyType", data.qtyTypes);
  fill("unit", data.units);

  // force repaint
  document.getElementById("itemCode").selectedIndex = 0;
};

}

function fill(id, arr, isDatalist = false){
  const el = document.getElementById(id);
  el.innerHTML = "";

  if (!arr || !arr.length) return;

  arr.forEach(v => {
    const o = document.createElement("option");

    if (isDatalist) {
      // datalist only needs value
      o.value = v;
    } else {
      o.value = v;
      o.textContent = v;
    }

    el.appendChild(o);
  });
}


async function toBase64(f){
  return new Promise(r=>{
    const fr = new FileReader();
    fr.onload=()=>r(fr.result);
    fr.readAsDataURL(f);
  });
}

async function saveData(){
  const file = document.getElementById("photo").files[0];
  const img = file ? await toBase64(file) : "";

  const payload = {
    itemCode: itemCode.value,
    itemName: itemName.value,
    color: color.value,
    qty: qty.value,
    qtyType: qtyType.value,
    unit: unit.value,
    person: person.value,
    reqType: reqType.value,
    image: img,
    imageName: file?.name || ""
  };

  const cb = "save_"+Date.now();
  window[cb] = res => {
    msg.textContent = res.success ? "Saved ✅" : res.error;
  };

  const s = document.createElement("script");
  s.src = SCRIPT_URL + "?action=saveRequirement&data=" +
          encodeURIComponent(JSON.stringify(payload)) +
          "&callback=" + cb;
  document.body.appendChild(s);
}

document.addEventListener("DOMContentLoaded", loadDropdowns);
</script>
</body>
</html>
